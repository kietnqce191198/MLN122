<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <!-- Background badge -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.4"/>
  
  <!-- Stylized Agriculture / Rice Sheaf & Cooperative Sprout -->
  <g transform="translate(32, 33)">
    <!-- Main stem -->
    <path d="M0,17 C-1,4 -1,-6 0,-18" fill="none" stroke="#facc15" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Top rice grain -->
    <path d="M0,-18 C-4,-23 -3,-27 0,-27 C3,-27 4,-23 0,-18 Z" fill="url(#goldGrad)"/>
    
    <!-- Left grains -->
    <path d="M0,-12 C-9,-17 -13,-14 -11,-10 C-9,-6 -4,-9 0,-10 Z" fill="url(#goldGrad)"/>
    <path d="M0,-4 C-10,-9 -14,-5 -12,-1 C-10,3 -4,0 0,-2 Z" fill="url(#goldGrad)"/>
    
    <!-- Right grains -->
    <path d="M0,-14 C9,-19 13,-16 11,-12 C9,-8 4,-11 0,-12 Z" fill="url(#goldGrad)"/>
    <path d="M0,-6 C10,-11 14,-7 12,-3 C10,1 4,-2 0,-4 Z" fill="url(#goldGrad)"/>
    
    <!-- Left cooperative green leaf embracing -->
    <path d="M-1,16 C-17,14 -21,1 -14,-6 C-9,-2 -5,6 -1,16 Z" fill="url(#leafGrad)"/>
    <!-- Right green leaf -->
    <path d="M1,16 C16,14 20,3 14,-3 C9,1 5,8 1,16 Z" fill="#34d399"/>
  </g>
</svg>
